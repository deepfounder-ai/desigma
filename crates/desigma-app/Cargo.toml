[package]
name = "desigma-app"
description = "desigma desktop editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "desigma"
path = "src/main.rs"

[features]
default = ["open-url"]
# Opens Present links in the system browser (after a confirmation).
open-url = ["dep:open"]
# Plays H.264 video fills in Present through Cisco's OpenH264 (C++ sources compiled by the
# `openh264` crate, so it needs a C++ compiler). Off by default: the default build stays pure Rust
# and still plays Motion JPEG; other codecs show their poster with an "Unsupported codec" badge.
video = ["dep:openh264"]

[dependencies]
open = { version = "5", optional = true }
openh264 = { version = "0.9", optional = true }
desigma-doc.workspace = true
desigma-engine.workspace = true
desigma-render.workspace = true
desigma-fig.workspace = true
desigma-library.workspace = true
desigma-fonts.workspace = true
desigma-export.workspace = true
desigma-http.workspace = true
desigma-svg.workspace = true
desigma-gpu.workspace = true
desigma-mcp.workspace = true
desigma-collab.workspace = true
desigma-net.workspace = true
arboard = "3"
eframe = "0.35.0"
rfd = "0.17.2"
image = { workspace = true, features = ["jpeg", "webp"] }
cosmic-text = "0.19.0"
unicode-segmentation = "1"
serde_json.workspace = true
serde.workspace = true
ureq = "2"
semver = "1"
sha2 = "0.11"
# the portable Windows zip is unpacked in process (the same features desigma-fig uses)
zip = { version = "9", default-features = false, features = ["deflate"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
roxmltree = "0.20"
egui = "0.35"
resvg = { version = "0.45", default-features = false }

# Finder and browser opens arrive as Apple events (see src/macos.rs); the versions winit uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSData", "NSString"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
gif = { version = "0.14", default-features = false, features = ["std"] }
