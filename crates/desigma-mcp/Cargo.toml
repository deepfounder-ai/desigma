[package]
name = "desigma-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["server"]
server = ["dep:rmcp", "dep:tokio"]

[dependencies]
desigma-doc.workspace = true
desigma-export.workspace = true
desigma-svg.workspace = true
desigma-library.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }

[[bin]]
name = "desigma-mcp"
required-features = ["server"]
