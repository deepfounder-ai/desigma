name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and packages everything, uploads workflow artifacts, and
  # creates no GitHub Release.
  workflow_dispatch:

env:
  RUST_VERSION: "1.93.1"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Tag builds compile the version in (About, --version, update checks); dry runs
      # stay unstamped, so they never look for updates.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "DESIGMA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # On Windows, crates/desigma-app/build.rs embeds the icon and version info
      # (rc.exe ships with the runner's Windows SDK); it fails the build under CI
      # if that step breaks, so an icon-less exe is never released.
      - name: Build desigma, desigma-diff and desigma-mcp
        run: cargo build --release --locked --target ${{ matrix.target }} -p desigma-app -p desigma-diff -p desigma-mcp

      - name: Check the stamped version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$(target/${{ matrix.target }}/release/desigma --version)" = "desigma ${DESIGMA_VERSION}"

      - name: Package
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}"

      # Windows only: the Inno Setup installer, next to the portable zip. Inno Setup 6 is
      # preinstalled on some runner images; otherwise it comes from Chocolatey.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v iscc >/dev/null 2>&1 && [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
          ls "/c/Program Files (x86)/Inno Setup 6/ISCC.exe"

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/package-windows-installer.sh "${{ steps.version.outputs.version }}" "target/${{ matrix.target }}/release"

      - uses: actions/upload-artifact@v4
        with:
          name: desigma-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error

  # One job builds both Apple architectures and packages a universal desigma.app
  # (.dmg for people, .tar.gz for scripts). macos-13 runners are retired, so the
  # Intel half is cross-compiled on the arm64 runner.
  macos:
    name: Build macOS universal app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "DESIGMA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" -p desigma-app -p desigma-diff -p desigma-mcp
          done

      - name: Check the stamped version
        if: github.ref_type == 'tag'
        run: test "$(target/aarch64-apple-darwin/release/desigma --version)" = "desigma ${DESIGMA_VERSION}"

      - name: Package desigma.app (.dmg and .tar.gz)
        run: scripts/package-macos.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: desigma-macos-universal
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, macos]
    # Tags only: manual (workflow_dispatch) runs stop after uploading artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        working-directory: dist
        run: |
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Shown above the generated notes.
          body: |
            ### Installing

            Download the file for your platform below. These builds are **not code-signed yet**, so the first launch shows a warning:

            - **macOS (Apple Silicon and Intel):** download `desigma-<version>-macos.dmg`, open it and drag **desigma** to **Applications**. The first time, open it from Applications, then go to **System Settings → Privacy & Security** and click **Open Anyway**. Or run `xattr -dr com.apple.quarantine /Applications/desigma.app`.
            - **Windows (recommended):** run `desigma-<version>-x86_64-windows-setup.exe`. It installs for your user without an admin prompt, adds a Start Menu entry and can associate `.desigma` files. In the SmartScreen dialog, click **More info → Run anyway**.
            - **Windows (portable):** unzip `desigma-<version>-x86_64-pc-windows-msvc.zip` and run `desigma.exe`; same SmartScreen steps.
            - **Linux:** unpack `desigma-<version>-x86_64-unknown-linux-gnu.tar.gz`, then run `./install.sh` (no sudo) or just `./desigma`.

            Full instructions: [docs/install.md](https://github.com/deepfounder-ai/desigma/blob/main/docs/install.md). Check downloads against `SHA256SUMS`.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*-setup.exe
            dist/SHA256SUMS
