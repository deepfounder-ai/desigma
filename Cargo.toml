[workspace]
resolver = "2"
members = [
    "crates/desigma-doc",
    "crates/desigma-engine",
    "crates/desigma-render",
    "crates/desigma-fonts",
    "crates/desigma-fig",
    "crates/desigma-library",
    "crates/desigma-app",
    "crates/desigma-diff",
    "crates/desigma-export",
    "crates/desigma-svg",
    "crates/desigma-gpu",
    "crates/desigma-mcp",
    "crates/desigma-http",
    "crates/desigma-net",
    "crates/desigma-collab",
    "crates/desigma-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deepfounder-ai/desigma"

[workspace.dependencies]
desigma-engine = { path = "crates/desigma-engine" }
desigma-doc = { path = "crates/desigma-doc" }
desigma-collab = { path = "crates/desigma-collab" }
desigma-render = { path = "crates/desigma-render" }
desigma-fig = { path = "crates/desigma-fig" }
desigma-library = { path = "crates/desigma-library" }
desigma-fonts = { path = "crates/desigma-fonts" }
desigma-export = { path = "crates/desigma-export" }
desigma-svg = { path = "crates/desigma-svg" }
desigma-gpu = { path = "crates/desigma-gpu" }
desigma-mcp = { path = "crates/desigma-mcp", default-features = false }
desigma-http = { path = "crates/desigma-http" }
desigma-net = { path = "crates/desigma-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2
